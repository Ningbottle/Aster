name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check:desktop

      - name: Desktop contract and regression tests
        run: npm run test:desktop

      - name: No-fake-data gate
        run: npm run lint:nofake

      - name: Build Electron main/preload/renderer
        run: npm run build:desktop

      - name: Real ThinkRail/Pi host integration
        run: npm run test:host
